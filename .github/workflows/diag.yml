name: Diag

# 临时诊断工作流：runner 上拿不到日志（本地读不到 Actions 日志），
# 所以把环境和 CMake 配置输出直接发成 Issue，用来排查 build.yml 的失败。
# 查清后删除本文件。
on:
  push:
    paths:
      - '.github/workflows/diag.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  diag:
    name: 收集诊断信息
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 收集环境与配置输出
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          $env:PYTHONIOENCODING = 'utf-8'
          New-Item -ItemType Directory -Force -Path ci-diag | Out-Null

          $t = @()
          $t += '### cmake --version'
          $t += (cmake --version 2>&1 | Out-String)
          $t += '### python --version'
          $t += (python --version 2>&1 | Out-String)

          $vw = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $t += "### vswhere 存在: " + (Test-Path $vw)
          if (Test-Path $vw) {
            $t += (& $vw -latest -products * -property installationPath 2>&1 | Out-String)
            $t += (& $vw -latest -products * -property installationVersion 2>&1 | Out-String)
          }

          $t += '### 按 build.yml 的方式跑配置（不合并 stderr，看谁往 stderr 写东西）'
          $cfg = (& cmake -S . -B ci-build -G "Visual Studio 17 2022" -A x64 2>&1 | Out-String)
          $t += $cfg
          $t += "### configure 退出码 = $LASTEXITCODE"

          $t += '### ci-build 里生成了什么'
          if (Test-Path ci-build) {
            $t += (Get-ChildItem ci-build -Recurse -File | Select-Object -First 60 -ExpandProperty FullName | Out-String)
          } else {
            $t += '(ci-build 目录没生成)'
          }

          ($t -join "`n") | Out-File -FilePath ci-diag/result.txt -Encoding utf8

      - name: 把结果发成 Issue
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Continue'
          if (-not (Test-Path ci-diag/result.txt)) {
            'result.txt 没生成，说明“收集”这一步在更早的地方就挂了' | Out-File -FilePath ci-diag/result.txt -Encoding utf8
          }
          $body = Get-Content ci-diag/result.txt -Raw
          if ($body.Length -gt 60000) { $body = $body.Substring(0, 60000) }
          $payload = @{
            title = "ci-diag 结果"
            body  = $body
          } | ConvertTo-Json -Depth 4
          Invoke-RestMethod -Method Post `
            -Uri 'https://api.github.com/repos/ABitGinger/Entray/issues' `
            -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' } `
            -Body $payload -ContentType 'application/json'
