name: Diag

# 临时诊断工作流：把 runner 上的环境信息和 CMake 配置输出原样推回 ci-diag 分支，
# 方便在没有 Actions 日志读取权限的地方排查。查清后即可删除本文件。
on:
  push:
    paths:
      - '.github/workflows/diag.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diag:
    name: 收集诊断信息
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 收集环境与配置输出
        shell: pwsh
        run: |
          # GitHub 的 pwsh 默认把原生命令的 stderr 当成错误抛出，这里放开，
          # 否则 CMake 的普通警告也会让这一步直接失败。
          $ErrorActionPreference = 'Continue'
          $env:PYTHONIOENCODING = 'utf-8'

          $out = New-Object System.Collections.Generic.List[string]
          $out.Add('### uname / 系统')
          $out.Add((Get-ComputerInfo -Property OsName,OsVersion,OsBuildNumber | Out-String))
          $out.Add('### cmake --version')
          $out.Add((cmake --version | Out-String))
          $out.Add('### python --version')
          $out.Add((python --version 2>&1 | Out-String))
          $out.Add('### vswhere -all -products *')
          $vw = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (Test-Path $vw) {
            $out.Add((& $vw -all -products * -format json | Out-String))
          } else {
            $out.Add('vswhere 不存在')
          }

          $out.Add('### cmake --help 中列出的生成器')
          $out.Add(((cmake --help) | Select-String -Pattern 'Visual Studio|Ninja|Makefiles' | Out-String))

          $out.Add('### 配置：Visual Studio 17 2022 / x64')
          $cfg = (& cmake -S . -B ci-build -G "Visual Studio 17 2022" -A x64 2>&1 | Out-String)
          $out.Add($cfg)
          $out.Add("### configure 退出码 = $LASTEXITCODE")

          foreach ($f in @('ci-build/CMakeFiles/CMakeError.log', 'ci-build/CMakeFiles/CMakeOutput.log')) {
            $out.Add("### $f")
            if (Test-Path $f) {
              $out.Add((Get-Content $f -Tail 120 | Out-String))
            } else {
              $out.Add('(不存在)')
            }
          }

          $out.Add('### ci-build 目录内容')
          if (Test-Path ci-build) {
            $out.Add((Get-ChildItem -Recurse ci-build | Select-Object -First 80 -ExpandProperty FullName | Out-String))
          } else {
            $out.Add('(目录没生成)')
          }

          New-Item -ItemType Directory -Force -Path ci-diag | Out-Null
          ($out -join "`n") | Out-File -FilePath ci-diag/result.txt -Encoding utf8

      - name: 推回诊断结果
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          git config user.name 'ci-diag'
          git config user.email 'ci-diag@users.noreply.github.com'
          git add -f ci-diag/result.txt
          git commit -m 'diag: CI 环境与 CMake 配置输出 [skip ci]'
          git push --force origin HEAD:ci-diag
